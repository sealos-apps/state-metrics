apiVersion: state-metrics.sealos.io/v1alpha1
kind: CollectorConfig
metadata:
  labels:
    app.kubernetes.io/name: sealos-state-metrics-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: domain-example
spec:
  collector: domain
  enabled: true
  value:
    domains:
      - endpoint: example.com
      - endpoint: api.example.com
    checkTimeout: 30s
