# This rule is not used by the project sealos-state-metrics-config-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over state-metrics.sealos.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sealos-state-metrics-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: collectorconfig-admin-role
rules:
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs
  verbs:
  - '*'
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs/status
  verbs:
  - get
