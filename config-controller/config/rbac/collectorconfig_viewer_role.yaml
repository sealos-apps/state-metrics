# This rule is not used by the project sealos-state-metrics-config-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to state-metrics.sealos.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sealos-state-metrics-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: collectorconfig-viewer-role
rules:
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs/status
  verbs:
  - get
