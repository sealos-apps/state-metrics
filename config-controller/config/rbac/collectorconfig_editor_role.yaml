# This rule is not used by the project sealos-state-metrics-config-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the state-metrics.sealos.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sealos-state-metrics-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: collectorconfig-editor-role
rules:
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - state-metrics.sealos.io
  resources:
  - collectorconfigs/status
  verbs:
  - get
