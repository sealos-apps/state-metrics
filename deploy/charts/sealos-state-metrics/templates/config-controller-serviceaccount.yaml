{{- if and .Values.configController.enabled .Values.configController.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sealos-state-metrics.configControllerServiceAccountName" . }}
  labels:
    {{- include "sealos-state-metrics.configControllerLabels" . | nindent 4 }}
  {{- with .Values.configController.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
