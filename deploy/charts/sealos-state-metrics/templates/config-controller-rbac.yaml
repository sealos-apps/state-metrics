{{- if and .Values.configController.enabled .Values.configController.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sealos-state-metrics.configControllerName" . }}
  labels:
    {{- include "sealos-state-metrics.configControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "update", "patch"]
  - apiGroups: ["state-metrics.sealos.io"]
    resources:
      - collectorconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sealos-state-metrics.configControllerName" . }}
  labels:
    {{- include "sealos-state-metrics.configControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sealos-state-metrics.configControllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sealos-state-metrics.configControllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
