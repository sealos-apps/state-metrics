{{- if .Values.configController.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sealos-state-metrics.configControllerName" . }}
  labels:
    {{- include "sealos-state-metrics.configControllerLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.configController.replicaCount }}
  selector:
    matchLabels:
      {{- include "sealos-state-metrics.configControllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sealos-state-metrics.configControllerSelectorLabels" . | nindent 8 }}
      {{- with .Values.configController.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sealos-state-metrics.configControllerServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.configController.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ .Values.configController.image }}
          imagePullPolicy: {{ .Values.configController.imagePullPolicy }}
          args:
            {{- if .Values.configController.leaderElection }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address={{ .Values.configController.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.configController.healthProbeBindAddress }}
            - --target-namespace={{ default .Release.Namespace .Values.configController.namespace }}
            - --target-configmap-name={{ default (include "sealos-state-metrics.fullname" .) .Values.configController.configMapName }}
            - --config-key={{ .Values.configController.configKey }}
            - --base-config-key={{ .Values.configController.baseConfigKey }}
            {{- if .Values.configController.watchNamespace }}
            - --watch-namespace={{ .Values.configController.watchNamespace }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            {{- toYaml .Values.configController.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.configController.resources | nindent 12 }}
      {{- with .Values.configController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.configController.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.configController.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
