name: Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Build version, supports sha-* or v*; empty uses current commit sha."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO != '' && secrets.DOCKERHUB_REPO || secrets.DOCKERHUB_USERNAME != '' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, 'sealos-state-metrics') || '' }}
  GHCR_REPO: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}

jobs:
  meta:
    name: Release Metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail

          RAW_VERSION="${{ github.event.release.tag_name || github.event.inputs.version || '' }}"
          if [[ -z "$(echo "${RAW_VERSION}" | xargs)" ]]; then
            RAW_VERSION="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          IMAGE_TAG="$(echo "${RAW_VERSION}" | xargs)"
          if [[ "${IMAGE_TAG}" != sha-* && "${IMAGE_TAG}" != v* ]]; then
            echo "unsupported version input: ${IMAGE_TAG}. expected sha-* or v*." >&2
            exit 1
          fi

          if [[ "${IMAGE_TAG}" == sha-* ]]; then
            INPUT_SHA="${IMAGE_TAG#sha-}"
            if [[ -z "${INPUT_SHA}" ]]; then
              echo "invalid sha version input: ${IMAGE_TAG}" >&2
              exit 1
            fi
            IS_RELEASE="false"
          else
            IS_RELEASE="true"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"

  build-docker-images:
    name: Build Docker Images
    permissions:
      packages: write
    needs: [meta]
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-24.04' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_REPO }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.image_tag }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
            runnumber=${{ github.run_id }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ env.GHCR_REPO }}${{ env.DOCKERHUB_REPO && format(',{0}', env.DOCKERHUB_REPO) }}",name-canonical=true,push-by-digest=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release-docker-images:
    name: Push Docker Images
    permissions:
      packages: write
    needs: [meta, build-docker-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_REPO }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_REPO}:${IMAGE_TAG}" \
            $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)
          if [ -n "${DOCKERHUB_REPO}" ]; then
            docker buildx imagetools create \
              -t "${DOCKERHUB_REPO}:${IMAGE_TAG}" \
              $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)
          fi

      - name: Update latest tag
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${GHCR_REPO}:latest" \
            $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)
          if [ -n "${DOCKERHUB_REPO}" ]; then
            docker buildx imagetools create \
              -t "${DOCKERHUB_REPO}:latest" \
              $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)
          fi

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REPO }}:${{ needs.meta.outputs.image_tag }}

  release-sealos-images:
    name: Push Sealos Images
    permissions:
      packages: write
    needs: [meta, release-docker-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: install cache images tools
        run: |
          sudo bash .github/scripts/install.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Prepare cluster image list
        id: cluster_image_targets
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          images=("${GHCR_REPO}-cluster:${IMAGE_TAG}")
          if [ "${{ needs.meta.outputs.is_release }}" = "true" ]; then
            images+=("${GHCR_REPO}-cluster:latest")
          fi
          if [ -n "${DOCKERHUB_REPO}" ]; then
            images+=("${DOCKERHUB_REPO}-cluster:${IMAGE_TAG}")
            if [ "${{ needs.meta.outputs.is_release }}" = "true" ]; then
              images+=("${DOCKERHUB_REPO}-cluster:latest")
            fi
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: cache images
        working-directory: deploy
        run: |
          sudo sealos login -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          sed -i "s#image: ghcr.io/labring/sealos-state-metrics:latest#image: ${{ env.GHCR_REPO }}:${{ needs.meta.outputs.image_tag }}#g" charts/sealos-state-metrics/values.yaml
          sudo sealos registry save --registry-dir=registry_amd64 --arch amd64 .
          sudo sealos registry save --registry-dir=registry_arm64 --arch arm64 .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_REPO }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Kubefile.mutli
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.image_tag }}
            runnumber=${{ github.run_id }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.cluster_image_targets.outputs.tags }}
